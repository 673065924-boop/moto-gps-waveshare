name: Cloud build firmware (1.75C)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-cloud-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    timeout-minutes: 45
    steps:
      - name: Checkout source and LVGL submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify ESP-IDF version
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
      - name: Set target chip
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C platforms/esp32 set-target esp32s3
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C platforms/esp32 build
      - name: Merge into single flashable binary
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p "$GITHUB_WORKSPACE/firmware_out"
          idf.py -C platforms/esp32 merge-bin -o "$GITHUB_WORKSPACE/firmware_out/moto-gps-1.75c.bin"
          cp platforms/esp32/build/flasher_args.json "$GITHUB_WORKSPACE/firmware_out/flasher_args.json"
          cd "$GITHUB_WORKSPACE/firmware_out"
          sha256sum moto-gps-1.75c.bin > SHA256SUMS.txt
          ls -lh
      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: moto-gps-firmware-1.75c
          path: firmware_out/*
          if-no-files-found: error
          retention-days: 90
